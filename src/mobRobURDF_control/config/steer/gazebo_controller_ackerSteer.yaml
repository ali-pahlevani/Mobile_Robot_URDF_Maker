controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    ackerSteer_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

ackerSteer_controller:
  ros__parameters:

    publish_rate: 50.0

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true

    front_steering: true

    front_wheel_track: 0.8
    rear_wheel_track: 0.8
    front_wheels_radius: 0.22
    rear_wheels_radius: 0.22
    wheelbase: 1.2

    #reference_timeout: 2.0
    open_loop: false
    #velocity_rolling_window_size: 10
    #position_feedback: false
    # Traction (driven) wheels are the rear wheels; steering wheels are the front.
    rear_wheels_names: [rear_right_joint, rear_left_joint]
    front_wheels_names: [chassis_to_front_right_steering, chassis_to_front_left_steering]

    use_stamped_vel: false

    traction_track_width: 0.8
    traction_wheels_radius: 0.22
    cmd_vel_timeout: 0.5
    traction:
      max_acceleration: 2.273
      max_deceleration: 2.273
    steering:
      max_position: 0.785
      max_velocity: 1.0
joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_joint
      - front_right_joint
      - rear_left_joint
      - rear_right_joint
      - chassis_to_front_left_steering
      - chassis_to_front_right_steering
